name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests, coverage, formatting and Checkstyle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/checkstyle-result.xml
          if-no-files-found: ignore

  coverage-badge:
    name: Update coverage badge
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: false
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download verified coverage report
        uses: actions/download-artifact@v4
        with:
          name: test-and-coverage-reports
          path: target

      - name: Generate Shields.io endpoint
        run: |
          LC_ALL=C awk -F, '
            NR == 1 {
              validHeader = ($8 == "LINE_MISSED" && $9 == "LINE_COVERED")
              next
            }
            {
              if ($8 !~ /^[0-9]+$/ || $9 !~ /^[0-9]+$/) invalid = 1
              missed += $8
              covered += $9
            }
            END {
              if (!validHeader || invalid || missed + covered == 0) {
                print "Invalid or empty JaCoCo line coverage report" > "/dev/stderr"
                exit 1
              }
              percent = 100 * covered / (missed + covered)
              color = percent >= 80 ? "brightgreen" : percent >= 60 ? "yellowgreen" : percent >= 50 ? "yellow" : "red"
              printf "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"%.2f%%\",\"color\":\"%s\"}\n", percent, color
            }
          ' target/site/jacoco/jacoco.csv > "$RUNNER_TEMP/coverage.json"

      - name: Publish endpoint to badges branch
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'A newer commit is on main; its CI run will update the badge.'
            exit 0
          fi
          git ls-remote --heads origin badges > "$RUNNER_TEMP/badges-ref"
          if [ -s "$RUNNER_TEMP/badges-ref" ]; then
            git fetch origin badges
            git switch --create badges FETCH_HEAD
          else
            git switch --orphan badges
          fi
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update coverage badge'
          git push origin HEAD:badges
